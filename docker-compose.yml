# Droparr — example deployment next to the *arr stack.
# Pulls the prebuilt multi-arch image from GHCR. Adjust volume paths to match
# your server layout, then: docker compose pull && docker compose up -d
# Full guide: docs/DEPLOYMENT.md
services:
  droparr:
    # `latest` follows the newest release candidate. Pin a specific candidate
    # for reproducible installs/rollbacks, e.g.:
    #   image: ghcr.io/patterueldev/droparr:v1.0.0-rc1
    image: ghcr.io/patterueldev/droparr:latest
    # To build from source instead of pulling, comment out `image:` and use:
    # build: .
    container_name: droparr
    ports:
      - "3100:3100"
    environment:
      # Staging dir must be a path *both* Droparr and the *arrs can see
      # (configure the same path in Settings → Staging directory).
      - DROPARR_DATA=/data
      - DROPARR_CONFIG=/config/config.json
      # Run as your media stack's PUID/PGID (must own ./config and be able to
      # write the quarantine uploads). Defaults to 1000:1000.
      - PUID=1000
      - PGID=1000
      # File mode mask for new files/dirs. 022 = owner write, group/other read.
      - UMASK=022
      # Restrict the server-side folder browser (colon-separated).
      # - DROPARR_BROWSE_ROOTS=/incoming:/media
      # *arr request timeout in ms (default 30000) — raise for slow VPNs.
      # - DROPARR_ARR_TIMEOUT_MS=30000
      # Escape hatch: override the Jellyfin URL (wins over config.json) —
      # recovery when the configured one is unreachable from the container
      # and nobody can log in to change it.
      # - DROPARR_JELLYFIN_URL=http://jellyfin:8096
    volumes:
      # JSON config (instances, categories, settings).
      - ./config:/config
      # Droparr's own state: SQLite (sessions, history, uploads) + quarantine.
      - ./data:/data
      # Shared staging volume — the *arrs must be able to read this too,
      # and each instance needs a path mapping for it in Settings.
      - ./staging:/data/staging
      # Example: where your drops land on the server.
      # - /mnt/media/incoming:/incoming
    restart: unless-stopped
